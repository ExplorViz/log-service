include:
  - path:
      - https://github.com/open-telemetry/opentelemetry-demo.git#main:compose.yaml
      - https://github.com/open-telemetry/opentelemetry-demo.git#main:compose.full.yaml

services:
  # Overrides / merges configuration from the included external compose
  otel-collector:
    volumes:
      - ./demo-collector-config.yaml:/etc/otelcol-config-extras.yml
    depends_on:
      custom-collector:
        condition: service_started

  custom-collector:
    image: explorviz/otel-collector
    hostname: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: on-failure
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - 55678:55678

  clickhouse:
    image: clickhouse/clickhouse-server:26.5
    hostname: clickhouse
    restart: always
    ports:
      - 8123:8123
      - 19000:9000
    volumes:
      - .:/docker-entrypoint-initdb.d
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
